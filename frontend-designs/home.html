
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roamly | Explore the World</title>

    <link rel="stylesheet" href="home.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">ROAMLY<span>.</span></div>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="#">Discover</a>
            <a href="#">About</a>
        </div>

        <div class="profile-menu">
            <button id="profile-btn" class="login-btn" type="button">
            Profile
            </button>

        <div id="profile-dropdown" class="profile-dropdown" hidden>
                <p id="profile-name"></p>
                <p id="profile-email"></p>
                <button id="logout-btn" type="button">Log Out</button>
        </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <p class="eyebrow">THE WORLD IS WAITING</p>

            <h1>
                Don't just travel.<br>
                <span>Experience.</span>
            </h1>

            <p class="hero-description">
                Discover extraordinary places, find hidden gems
                and create journeys worth remembering.
            </p>

            <a href="explore.html" class="explore-btn">
            Start Exploring →
            </a>

        </div>

    </section>

<!-- LOCATION DISCOVERY SECTION -->



    <script type="module">
        import { auth } from "../firebase-config.js";
        import {
           onAuthStateChanged,
           signOut
        } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

        const profileButton = document.getElementById("profile-btn");
        const dropdown = document.getElementById("profile-dropdown");
        const nameText = document.getElementById("profile-name");
        const emailText = document.getElementById("profile-email");
        const logoutButton = document.getElementById("logout-btn");

         // Show the signed-in user's details
         onAuthStateChanged(auth, (user) => {
            if (user) {
               profileButton.textContent = "Profile";
               nameText.textContent = user.displayName || "Your profile";
               emailText.textContent = user.email || "";
            } else {
               // If nobody is signed in, send them to the sign-in page
               window.location.href = "index.html";
            }
        });

        // Open or close the profile dropdown
         profileButton.addEventListener("click", () => {
             dropdown.hidden = !dropdown.hidden;
        });

        // Sign out
        logoutButton.addEventListener("click", async () => {
           try {
            await signOut(auth);
            window.location.href = "index.html";
           } catch (error) {
            console.error("Logout failed:", error);
           }
    });

</script>
    

</body>

</html>
